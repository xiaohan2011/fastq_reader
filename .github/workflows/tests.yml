name: FASTQ Reader tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS Apple Silicon
            runner: macos-15
          - platform: macOS Intel
            runner: macos-15-intel
          - platform: Windows x64
            runner: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.9"

      - name: Install locked Python dependencies
        run: |
          uv python install
          uv sync --locked --managed-python

      - name: Install native alignment tools
        if: runner.os == 'macOS'
        run: |
          brew install minimap2 samtools
          minimap2 --version
          samtools --version-only

      - name: Run synthetic FASTQ tests
        run: uv run --locked --no-sync python -m pytest -ra
